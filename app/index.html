<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="color-scheme" content="dark">
<title>AInalyzer Trading</title>
<link rel="stylesheet" href="css/app.css?v=1.2.0">
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="config.js"></script>
</head>
<body data-tab="signal">
<div class="glow" aria-hidden="true"></div>
<header class="appbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.5" fill="#161C26" stroke="#2A3242" stroke-width="1.5"/>
      <path d="M26 34 L50 18 M14 46 L38 40" stroke="#E6E9EF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
      <polyline points="14,46 26,34 38,40 50,18" fill="none" stroke="#E6E9EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="46" r="4" fill="#E6E9EF"/><circle cx="26" cy="34" r="4" fill="#E6E9EF"/><circle cx="38" cy="40" r="4" fill="#E6E9EF"/>
      <circle cx="50" cy="18" r="8.5" fill="#22C55E" opacity="0.25"/><circle cx="50" cy="18" r="4.5" fill="#22C55E"/>
    </svg>
    <span class="brand-name">
      <span class="greet" id="greet">Selamat datang</span>
      <span class="brand-word"><b>AI</b>nalyzer</span><span class="brand-sub">Trading</span>
    </span>
  </div>
  <div class="appbar-acts">
    <button class="icon-btn round" id="refreshBtn" type="button" aria-label="Scan ulang semua sinyal"></button>
    <button class="icon-btn round" id="bellBtn" type="button" aria-label="Sinyal baru"></button>
  </div>
</header>

<main class="views">
  <section class="view" id="view-signal" data-tab="signal" aria-label="Sinyal"></section>
  <section class="view" id="view-market" data-tab="market" aria-label="Pasar" hidden></section>
  <section class="view" id="view-chart" data-tab="chart" aria-label="Chart" hidden></section>
  <section class="view" id="view-more" data-tab="more" aria-label="Lainnya" hidden></section>
</main>

<nav class="tabbar" aria-label="Navigasi utama">
  <button type="button" class="tab" data-tab="signal"><span class="tab-ic" data-icon="signal"></span><span>Sinyal</span></button>
  <button type="button" class="tab" data-tab="market"><span class="tab-ic" data-icon="market"></span><span>Pasar</span></button>
  <button type="button" class="fab" id="scanFab" aria-label="Scan semua sinyal"><span data-icon="refresh"></span></button>
  <button type="button" class="tab" data-tab="chart"><span class="tab-ic" data-icon="chart"></span><span>Chart</span></button>
  <button type="button" class="tab" data-tab="more"><span class="tab-ic" data-icon="more"></span><span>Lainnya</span></button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js?v=1.2.0"></script>
</body>
</html>
